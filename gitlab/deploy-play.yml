# Pubblicazione automatica / manuale su Google Play Store.
#
# Carica l'Android App Bundle prodotto da build_android_signed su Google Play
# e lo assegna alla traccia configurata in PLAY_TRACK (default: alpha / test chiuso).
#
# Variabile CI richiesta (Settings > CI/CD > Variables):
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  tipo File, chiave JSON del service account
#                                     abilitato alle API di Google Play Developer.
#
# Nota: il primissimo bundle di un'app nuova va caricato una volta a mano dalla
# Play Console, successivamente le API permettono l'upload automatizzato via CI.

deploy_play:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: build_android_signed
      artifacts: true
  resource_group: stepbound-play-release
  interruptible: false
  environment:
    name: "google-play/$PLAY_TRACK"
    url: "https://play.google.com/console"
  cache: []
  variables:
    PLAY_PACKAGE_NAME: "com.genericlab.stepbound"
    PLAY_TRACK: "alpha"
    PLAY_RELEASE_STATUS: "completed"
    PLAY_RELEASE_NOTES_LANGUAGE: "it-IT"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(web|schedule|api)$/'
      when: manual
      allow_failure: false

  before_script:
    - pip install --no-cache-dir -r tools/play/requirements.txt
  script:
    - export PLAY_RELEASE_NAME="${CI_COMMIT_SHORT_SHA} (pipeline ${CI_PIPELINE_IID})"
    - export PLAY_RELEASE_NOTES="${CI_COMMIT_TITLE}"
    - |
      python tools/play/upload.py \
        --aab build/app/outputs/bundle/release/app-release.aab \
        --package-name "$PLAY_PACKAGE_NAME" \
        --track "$PLAY_TRACK" \
        --status "$PLAY_RELEASE_STATUS"
