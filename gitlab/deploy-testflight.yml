# Pubblicazione su Apple TestFlight.
#
# Carica l'.ipa prodotto da build_ios_signed su App Store Connect / TestFlight
# tramite xcrun altool con API Key App Store Connect.
#
# Variabili CI richieste (Settings > CI/CD > Variables):
#   ASC_KEY_ID       identificativo della chiave API App Store Connect
#   ASC_ISSUER_ID    issuer ID dell'account Apple Developer
#   ASC_KEY_P8       tipo File, chiave privata .p8

deploy_testflight:
  extends: .macos
  stage: deploy
  needs:
    - job: build_ios_signed
      artifacts: true
  interruptible: false
  cache: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(web|api)$/'
      when: manual
      allow_failure: false

  before_script: []
  script:
    - |
      set -eu
      echo "=== Diagnostica Ambiente ==="
      echo "Data/ora Mac (UTC): $(date -u)"

      for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
        eval "val=\${$v:-}"
        if [ -z "$val" ]; then
          echo "ERRORE: variabile CI $v non impostata." >&2
          exit 1
        fi
      done

      # Sanificazione da whitespace accidentali
      KEY_ID=$(echo "$ASC_KEY_ID" | tr -d '[:space:]')
      ISSUER_ID=$(echo "$ASC_ISSUER_ID" | tr -d '[:space:]')

      echo "Key ID: $KEY_ID (lunghezza ${#KEY_ID})"
      echo "Issuer ID: $ISSUER_ID (lunghezza ${#ISSUER_ID})"

      # Preparazione directory chiavi cercate da altool
      mkdir -p "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"

      KEY_FILE="$HOME/private_keys/AuthKey_${KEY_ID}.p8"
      # Rimuove ritorni a capo Windows (CRLF) ed eventuali spazi superflui
      tr -d '\r' < "$ASC_KEY_P8" > "$KEY_FILE"
      chmod 600 "$KEY_FILE"

      cp "$KEY_FILE" "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"
      cp "$KEY_FILE" "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      echo "Verifica formato chiave:"
      head -n 1 "$KEY_FILE"
      tail -n 1 "$KEY_FILE"

      IPA=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n1 || true)
      if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
        echo "ERRORE: nessun file .ipa trovato in build/ios/ipa/." >&2
        exit 1
      fi

      echo "Upload di $IPA su App Store Connect / TestFlight per App ID 6816988482..."
      xcrun altool --upload-app --type ios --file "$IPA" \
        --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" \
        --apple-id 6816988482
  after_script:
    - rm -rf "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys" || true
