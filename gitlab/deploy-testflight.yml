# Pubblicazione su Apple TestFlight.
#
# Carica l'.ipa prodotto da build_ios_signed su App Store Connect / TestFlight
# tramite xcrun altool con API Key App Store Connect.
#
# Variabili CI richieste (Settings > CI/CD > Variables):
#   ASC_KEY_ID       identificativo della chiave API App Store Connect
#   ASC_ISSUER_ID    issuer ID dell'account Apple Developer
#   ASC_KEY_P8       tipo File, chiave privata .p8

deploy_testflight:
  extends: .macos
  stage: deploy
  needs:
    - job: build_ios_signed
      artifacts: true
  interruptible: false
  cache: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(web|api)$/'
      when: manual
      allow_failure: false

  before_script: []
  script:
    - |
      set -eu
      echo "=== Diagnostica Ambiente ==="
      echo "Data/ora Mac (UTC): $(date -u)"

      for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
        eval "val=\${$v:-}"
        if [ -z "$val" ]; then
          echo "ERRORE: variabile CI $v non impostata." >&2
          exit 1
        fi
      done

      KEY_ID=$(echo "$ASC_KEY_ID" | tr -d '[:space:]')
      ISSUER_ID=$(echo "$ASC_ISSUER_ID" | tr -d '[:space:]')

      echo "Key ID: ${KEY_ID:0:3}...${KEY_ID: -3} (totale: ${#KEY_ID} car)"
      echo "Issuer ID: ${ISSUER_ID:0:4}...${ISSUER_ID: -4} (totale: ${#ISSUER_ID} car)"

      mkdir -p "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"

      KEY_FILE="$HOME/private_keys/AuthKey_${KEY_ID}.p8"
      tr -d '\r' < "$ASC_KEY_P8" > "$KEY_FILE"
      chmod 600 "$KEY_FILE"

      cp "$KEY_FILE" "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"
      cp "$KEY_FILE" "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      echo "Dimensione file chiave: $(wc -c < "$KEY_FILE") byte, righe: $(wc -l < "$KEY_FILE")"

      # Test validazione e verifica autenticazione diretta con l'API Apple
      ruby - "$KEY_FILE" "$KEY_ID" "$ISSUER_ID" <<'EOF'
      require "openssl"
      require "base64"
      require "json"
      require "net/http"

      key_file, key_id, issuer_id = ARGV

      begin
        key = OpenSSL::PKey::EC.new(File.read(key_file))
        puts "OpenSSL: Chiave EC valida (curva: #{key.group.curve_name})"
      rescue => e
        puts "ERRORE critico: lettura chiave fallita: #{e}"
        exit 1
      end

      def b64(str)
        Base64.urlsafe_encode64(str, padding: false)
      end

      h = b64(JSON.generate({ alg: "ES256", kid: key_id, typ: "JWT" }))
      p = b64(JSON.generate({ iss: issuer_id, iat: Time.now.to_i, exp: Time.now.to_i + 1200, aud: "appstoreconnect-v1" }))
      msg = "#{h}.#{p}"
      digest = OpenSSL::Digest::SHA256.digest(msg)
      asn1_sig = key.dsa_sign_asn1(digest)
      asn1 = OpenSSL::ASN1.decode(asn1_sig)
      r = asn1.value[0].value.to_s(2).rjust(32, "\x00")
      s = asn1.value[1].value.to_s(2).rjust(32, "\x00")
      jwt = "#{msg}.#{b64(r + s)}"

      uri = URI("https://api.appstoreconnect.apple.com/v1/apps")
      req = Net::HTTP::Get.new(uri)
      req["Authorization"] = "Bearer #{jwt}"
      res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }
      puts "Verifica diretta API Apple Store Connect: HTTP #{res.code}"
      puts "Dettagli risposta Apple: #{res.body}"
      EOF

      IPA=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n1 || true)
      if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
        echo "ERRORE: nessun file .ipa trovato in build/ios/ipa/." >&2
        exit 1
      fi

      echo "Upload di $IPA su App Store Connect / TestFlight..."
      xcrun altool --upload-app --type ios --file "$IPA" \
        --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
  after_script:
    - rm -rf "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys" || true
