version: 0.1.0+1

environment:
  sdk: 3.12.2

dependencies:
  flame: 1.38.2
  flutter:
    sdk: flutter
  meta: 1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.3.0

flutter:
