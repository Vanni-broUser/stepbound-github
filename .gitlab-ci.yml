# Una pipeline per commit: quando esiste una merge request, la pipeline MR
# sostituisce quella di branch per evitare build duplicate.
workflow:
  rules:
    - if: '$GITLAB_CI == "false"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build-android
  - build-ios
  - verify
  - deploy

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

default:
  image: ghcr.io/cirruslabs/flutter:3.44.0
  interruptible: true
  tags:
    - test
  before_script:
    - flutter config --no-analytics
    - flutter pub get

cache:
  key:
    files:
      - pubspec.lock
  paths:
    - .pub-cache/

.flutter_3_44_2:
  variables:
    FLUTTER_VERSION: "3.44.2"
  before_script:
    - FLUTTER_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
    - git config --global --add safe.directory '*'
    - git -C "$FLUTTER_DIR" fetch --depth 1 origin "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
    - git -C "$FLUTTER_DIR" checkout --quiet "$FLUTTER_VERSION"
    - flutter --version
    - flutter config --no-analytics
    - flutter pub get

include:
  - local: 'gitlab/build-android.yml'
  - local: 'gitlab/build-ios.yml'
  - local: 'gitlab/verify.yml'
  - local: 'gitlab/pages.yml'
  - local: 'gitlab/deploy-play.yml'
  - local: 'gitlab/deploy-testflight.yml'
